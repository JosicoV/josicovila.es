name: Deploy josicovila.es

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            set -e
            cd /opt/containers/josicovila-es/repo
            git fetch origin
            git checkout ${{ github.ref_name }}
            git pull --ff-only origin ${{ github.ref_name }}
            # El compose de produccion esta versionado en el repo.
            # Fija name: josicovila-es, asi que el proyecto de compose es el
            # mismo se invoque desde donde se invoque.
            DOCKER_BUILDKIT=0 docker compose -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.prod.yml ps
